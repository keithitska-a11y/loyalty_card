<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Loyalty Card Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-color: #FFF4DE; 
            background-image: 
                linear-gradient(#F2D0B1 1px, transparent 1px), 
                linear-gradient(90deg, #F2D0B1 1px, transparent 1px); 
            background-size: 25px 25px; 
            color: #2c1e11; 
        }

        .portal-center-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            max-width: 420px;
        }

        .search-instruction-label {
            font-size: 16px;
            font-weight: 700;
            color: #7c533c;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
		
		.updates-caption {
            font-size: 12px;
            font-weight: 600;
            color: #9c806c;
            margin-top: -6px; /* Pulls it up slightly closer to the main heading */
            margin-bottom: 16px; /* Creates spacing above the search input row */
            letter-spacing: 0.3px;
		}

        .search-box-row {
            margin-bottom: 24px;
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .search-input {
            flex: 1;
            padding: 14px 20px;
            font-size: 16px;
            border: 3px solid #7c533c;
            border-radius: 20px;
            outline: none;
            color: #4a3321;
            font-weight: 600;
            background: #ffffff;
            box-shadow: 0 4px 12px rgba(124, 83, 60, 0.05);
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: #e19e75;
        }

        .search-input::placeholder {
            color: #c9b19f;
        }

        .search-btn {
            padding: 0 25px;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #e19e75, #c87a4b);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(200, 122, 75, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(200, 122, 75, 0.35);
        }

        .card-display-area {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }

        .loyalty-card-trigger {
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: none;
        }

        .loyalty-card-trigger:hover {
            transform: scale(1.04);
        }

        .loyalty-card-trigger img {
            width: 100%;
            max-width: 340px;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(124, 83, 60, 0.25);
            display: block;
        }

        .no-result-msg {
            color: #9c806c;
            font-weight: 600;
            font-size: 14px;
            display: none;
            background: rgba(255, 255, 255, 0.6);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px dashed #e2d3ba;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(44, 30, 17, 0.65); 
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
        }

        .modal-card-container {
            background: transparent; /* Removes the white background */
            border: none; /* Removes the brown border frame */
            border-radius: 0;
            width: 100%;
            max-width: 680px; /* Limits maximum size to keep aspect ratio safe */
            padding: 0; /* Drops outer white padding */
            transform: scale(0.85);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .modal-card-container img {
            width: 100%;
            height: auto;
            border-radius: 20px; /* Keeps the card edges rounded nicely */
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); /* Drops clean shadow straight from your image data */
            display: block;
        }

        .info-dropdown-drawer {
            margin-top: 18px;
            background: #fffaf0;
            border: 2px dashed #e19e75;
            border-radius: 16px;
            padding: 14px;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
            display: none;
            max-height: 220px;
            overflow-y: auto;
        }

        .info-title {
            font-size: 11px;
            font-weight: 800;
            color: #c87a4b;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .discount-item-block {
            margin-bottom: 12px;
            border-bottom: 1px dashed rgba(225, 158, 117, 0.3);
            padding-bottom: 10px;
        }
        .discount-item-block:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }

        .info-detail {
            font-size: 14px;
            color: #4a3321;
            font-weight: 600;
            margin: 0;
            line-height: 1.4;
        }

        .expiry-caption {
            color: #8c827a; 
            font-size: 12px; 
            font-weight: 500;
            margin-top: 4px;
            margin-bottom: 0;
            display: block;
        }

        .close-portal-btn {
            margin-top: 20px;
            padding: 10px 35px;
            font-size: 14px;
            background: #fff4de;
            color: #7c533c;
            border: 1px solid #e2d3ba;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
        }

        .close-portal-btn:hover {
            background: #7c533c;
            color: white;
            border-color: #7c533c;
        }
		@keyframes typingDots {
            0% { content: ""; }
            25% { content: "."; }
            50% { content: ".."; }
            75% { content: "..."; }
            100% { content: ""; }
        }

        .searching-pulse::after {
            content: "";
            animation: typingDots 1.0s infinite steps(1);
            font-weight: 700;
            display: inline-block;
            width: 15px; /* Reserves space so the button layout doesn't jitter */
            text-align: left;
        }
    </style>
</head>
<body>

		<div class="portal-center-layout">
			<div class="search-instruction-label">Enter your discord username</div>
			
			<div class="updates-caption">updates at 12:00 GMT 8+</div>

			<div class="search-box-row">
				<input type="text" id="username-input" class="search-input" placeholder="e.g. 87_86" onkeydown="if(event.key==='Enter') findCard()">
				<button class="search-btn" id="find-btn" onclick="findCard()">FIND</button>
			</div>

			<div class="card-display-area" style="flex-direction: column;">
				<button id="result-card" class="loyalty-card-trigger" onclick="openEnlargedView()">
					<img id="card-img" src="" alt="Loyalty Card Graphic Asset">
				</button>
				<div id="click-details-hint" style="display: none; color: #9c806c; font-weight: 600; font-size: 13px; margin-top: 10px; letter-spacing: 0.5px; text-transform: uppercase;">
					click to see details
				</div>
				<div id="empty-message" class="no-result-msg">No loyalty records found for this username.</div>
			</div>
		</div>

    <div id="portal-modal" class="modal-overlay" onclick="closeEnlargedView()">
        <div class="modal-card-container" onclick="event.stopPropagation()">
            <img id="modal-img" src="" alt="Enlarged Card Display View">
            
            <div id="modal-dropdown" class="info-dropdown-drawer">
                <div class="info-title">Active Perks & Discounts</div>
                <div id="discounts-list-container"></div>
            </div>

            <button class="close-portal-btn" onclick="closeEnlargedView()">Close Card</button>
        </div>
    </div>

    <script>
        /**
         * MANUAL DATABASE DICTIONARY (ARRAY VERSION)
         * Notice how 'perks' is now inside brackets [ ] containing multiple reward items.
         */
        const loyaltyDatabase = {
            "pillowpee73": {
                image: "images/pillow.png",
                hasDiscount: true,
                perks: [
                    { text: "⋆˚꩜｡ FREE Illustration", expiry: "November 30, 2026" }
                ]
            },
            "blissfulasmo": {
                image: "images/blissfullystraight.png",
                hasDiscount: false,
                perks: [] // Stays empty
            },
			"b0ts": {
				image: "images/bots_1.png",
				hasDiscount: false,
				perks: []
			},
			"marvelouscarty": {
				image: "images/carty.png",
				hasDiscount: false,
				perks: []
			},
			"rawr3766": {
				image: "images/eepy.png",
				hasDiscount: false,
				perks: []
			},
			"vxiiveelyn": {
				image: "images/ivy.png",
				hasDiscount: false,
				perks: []
			},
			"jane": {
				image: "images/jane2.png",
				hasDiscount: false,
				perks: []
			},
			"aian_jj": {
				image: "images/jayden.png",
				hasDiscount: false,
				perks: []
			},
			"kkookie": {
				image: "images/ENTER.png",
				hasDiscount: false,
				perks: []
			},
			"opal_arts": {
				image: "images/kookie.png",
				hasDiscount: false,
				perks: []
			},
			"grask": {
				image: "images/eepy.png",
				hasDiscount: false,
				perks: []
			},
			"maybewanderer": {
				image: "images/robin_1.png",
				hasDiscount: false,
				perks: []
			},
			"akiciro": {
                image: "images/Sebastian.png",
                hasDiscount: true,
                perks: [
                    { text: "⋆˚꩜｡ 20% OFF on the next Illustration", expiry: "November 22, 2026" }
                ]
            }
        };

        let currentActiveRecord = null;

        function findCard() {
            const inputField = document.getElementById('username-input');
            const resultCardBtn = document.getElementById('result-card');
            const cardImgEl = document.getElementById('card-img');
            const emptyMsgEl = document.getElementById('empty-message');
            const findBtn = document.getElementById('find-btn'); 
            const detailsHintEl = document.getElementById('click-details-hint'); // 👈 THIS WIRING WAS MISSING

            const targetUser = inputField.value.trim().toLowerCase().replace(/^@/, '');

            if (!targetUser) {
                alert("Please enter a username first.");
                return;
            }

            findBtn.innerText = "searching";
            findBtn.classList.add('searching-pulse');
            findBtn.disabled = true;

            const record = loyaltyDatabase[targetUser];

            setTimeout(() => {
                findBtn.innerText = "FIND";
                findBtn.classList.remove('searching-pulse');
                findBtn.disabled = false;

                if (record) {
                    currentActiveRecord = record;
                    cardImgEl.src = record.image;
                    emptyMsgEl.style.display = 'none';
                    resultCardBtn.style.display = 'block';
                    detailsHintEl.style.display = 'block'; // 👈 THIS MAKES IT SHOW UP ON SUCCESS
                } else {
                    currentActiveRecord = null;
                    resultCardBtn.style.display = 'none';
                    cardImgEl.src = '';
                    emptyMsgEl.style.display = 'block';
                    detailsHintEl.style.display = 'none'; // 👈 THIS KEEPS IT HIDDEN ON FAILURE
                }
            }, 1800); 
        }

        function openEnlargedView() {
            if (!currentActiveRecord) return;

            const modalOverlay = document.getElementById('portal-modal');
            const modalImg = document.getElementById('modal-img');
            const modalDropdown = document.getElementById('modal-dropdown');
            const listContainer = document.getElementById('discounts-list-container');

            modalImg.src = currentActiveRecord.image;
            listContainer.innerHTML = '';

            if (currentActiveRecord.hasDiscount && currentActiveRecord.perks && currentActiveRecord.perks.length > 0) {
                currentActiveRecord.perks.forEach(perk => {
                    const block = document.createElement('div');
                    block.className = 'discount-item-block';
                    
                    const detailsNode = document.createElement('p');
                    detailsNode.className = 'info-detail';
                    detailsNode.textContent = perk.text;
                    
                    const expiryNode = document.createElement('span');
                    expiryNode.className = 'expiry-caption';
                    expiryNode.textContent = `Expires: ${perk.expiry}`;
                    
                    block.appendChild(detailsNode);
                    block.appendChild(expiryNode);
                    listContainer.appendChild(block);
                });
                
                modalDropdown.style.display = 'block';
            } else {
                modalDropdown.style.display = 'none';
            }

            modalOverlay.style.display = 'flex';
            setTimeout(() => {
                modalOverlay.classList.add('active');
            }, 10);
        }

        function closeEnlargedView() {
            const modalOverlay = document.getElementById('portal-modal');
            modalOverlay.classList.remove('active');
            setTimeout(() => {
                modalOverlay.style.display = 'none';
            }, 300);
        }
    </script>
</body>
</html>
